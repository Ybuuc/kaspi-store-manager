{% extends "kaspibot/base.html" %}
{% block content %}

<h3>{{ _("Тауарды өзгерту") }}</h3>

<form method="post" class="row g-3 mt-1"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="col-md-8">
    <label class="form-label">{{ _("Тауар атауы") }}</label>
    <input class="form-control" name="name" value="{{ product.name }}" required>
  </div>

  <div class="col-md-2">
    <label class="form-label">{{ _("Сатып алу бағасы") }}</label>
    <input class="form-control" name="purchase_price" type="number" min="1" value="{{ product.purchase_price }}" required>
  </div>

  <div class="col-md-2">
    <label class="form-label">{{ _("Қалдық") }}</label>
    <input class="form-control" name="stock_qty" type="number" min="0" value="{{ product.stock_qty }}" required>
  </div>

  <div class="col-12 d-flex gap-2">
    <button class="btn btn-primary">{{ _("Сақтау") }}</button>
    <a class="btn btn-secondary" href="{{ url_for('kaspibot.products') }}">{{ _("Артқа") }}</a>
  </div>
</form>

{% endblock %}
