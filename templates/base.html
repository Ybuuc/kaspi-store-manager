<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kaspi Store Manager{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a href="{{ url_for('index') }}">Kaspi Store Manager</a>
    {% if g.user %}
    <nav><span>{{ g.user['username'] }}</span><form action="{{ url_for('logout') }}" method="post"><button type="submit">Шығу</button></form></nav>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
