{% extends 'management_base.html' %}
{% block title %}{{ _("Кіру · Kaspi Store Manager") }}{% endblock %}
{% block management_content %}
<section class="panel narrow">
  <h1>{{ _("Жүйеге кіру") }}</h1>
  {% if error %}<p class="error" role="alert">{{ _(error) }}</p>{% endif %}
  <form method="post">
    <label for="username">{{ _("Логин") }}</label>
    <input id="username" name="username" autocomplete="username" required value="{{ request.form.get('username', '') }}">
    <label for="password">{{ _("Құпиясөз") }}</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">{{ _("Кіру") }}</button>
  </form>
</section>
{% endblock %}
