{% extends 'management_base.html' %}
{% block title %}{{ _("Қалдықты өзгерту · Kaspi Store Manager") }}{% endblock %}
{% block management_content %}
<section class="panel narrow">
  <h1>{{ product['name'] }}{{ _(": қалдықты өзгерту") }}</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="stock_qty">{{ _("Қойма қалдығы") }}</label>
    <input id="stock_qty" name="stock_qty" type="number" min="0" step="1" required value="{{ request.form.get('stock_qty', product['stock_qty']) }}">
    <button type="submit">{{ _("Сақтау") }}</button>
  </form>
</section>
{% endblock %}
