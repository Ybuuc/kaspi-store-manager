{% extends 'management_base.html' %}
{% block title %}{{ _("Бағаны өзгерту · Kaspi Store Manager") }}{% endblock %}
{% block management_content %}
<section class="panel narrow">
  <h1>{{ product['name'] }} {{ _("— бағаны өзгерту") }}</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="price">{{ _("Жаңа баға (₸)") }}</label>
    <input id="price" name="price" type="number" min="0.01" step="0.01" required value="{{ request.form.get('price', '%.2f'|format(product['price_cents'] / 100)) }}">
    <button type="submit">{{ _("Сақтау") }}</button>
  </form>
  <p><a href="{{ url_for('management.product_detail', product_id=product['id']) }}">{{ _("← Тауар карточкасы") }}</a></p>
</section>
{% endblock %}
