{% extends 'base.html' %}
{% block title %}Бағаны өзгерту · Kaspi Store Manager{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>{{ product['name'] }} — бағаны өзгерту</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="price">Жаңа баға (₸)</label>
    <input id="price" name="price" type="number" min="0.01" step="0.01" required value="{{ request.form.get('price', '%.2f'|format(product['price_cents'] / 100)) }}">
    <button type="submit">Сақтау</button>
  </form>
  <p><a href="{{ url_for('product_detail', product_id=product['id']) }}">← Тауар карточкасы</a></p>
</section>
{% endblock %}
