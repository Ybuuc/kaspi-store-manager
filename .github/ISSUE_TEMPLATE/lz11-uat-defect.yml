name: "ЛЗ11 — UAT-дефект (независимая команда)"
description: "Замечание, фактически воспроизведённое независимым заказчиком по UAT-01…UAT-10"
title: "[ЛЗ11][UAT][P2] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Создавайте только реальные дефекты после самостоятельной проверки другой командой. Не вставляйте пароли и персональные данные."
  - type: input
    id: team
    attributes:
      label: "Название команды и представитель"
      placeholder: "Команда / имя или GitHub handle"
    validations:
      required: true
  - type: input
    id: uat-id
    attributes:
      label: "UAT ID"
      placeholder: "UAT-01"
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: "Приоритет"
      options:
        - "P0 — критическая потеря данных или компрометация"
        - "P1 — блокирующий дефект"
        - "P2 — существенный, обход существует"
        - "P3 — косметический"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Шаги для воспроизведения"
      placeholder: "1. Открыть... 2. Нажать..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Ожидалось"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Получено в действительности"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Evidence и среда"
      description: "Дата, SHA, браузер, версия, ссылка на обезличенный скриншот/лог"
    validations:
      required: true
