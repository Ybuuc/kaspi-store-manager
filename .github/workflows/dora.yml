name: DORA dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'
permissions:
  contents: read
  deployments: read
  issues: read
  pull-requests: read
  actions: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install matplotlib==3.11.2
      - run: python tools/dora.py export --repo "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python tools/dora.py report
      - uses: actions/upload-artifact@v4
        with:
          name: dora-dashboard
          path: |
            docs/ci-cd/lz10/data/github.json
            docs/ci-cd/lz10/reports/
          if-no-files-found: error
