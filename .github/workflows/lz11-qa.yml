name: LZ11 pytest integration and internal UAT preflight

on:
  pull_request:
  push:
    branches: [main, lz11-qa-uat-postmortem]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production dependencies and pytest
        run: |
          python -m pip install -r requirements.lock
          python -m pip install pytest==8.4.2
      - name: Run unit, integration, UAT technical preflight and demo seed regression
        run: python -m pytest -q tests/test_app.py tests/lz11/test_contract.py tests/lz11/test_uat_preflight.py tests/lz11/test_demo_seed.py
