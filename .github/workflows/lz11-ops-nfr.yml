name: LZ11 200-VU NFR and SQLite restore drill

on:
  push:
    branches: [lz11-qa-uat-postmortem]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operations-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Generate disposable demo secrets
        run: |
          python3 - <<'PY'
          import os,secrets
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
              for key in ("KSM_SECRET_KEY","KSM_UAT_PASSWORD"):
                  value=secrets.token_urlsafe(32)
                  print(f"::add-mask::{value}")
                  f.write(f"{key}={value}\n")
          PY

      - name: Launch synthetic app in Docker
        id: boot
        run: |
          mkdir -p reports/lz11
          docker compose -f ops/lz11/compose.yaml up -d --build app
          python3 - <<'PY'
          import time,urllib.request
          deadline=time.monotonic()+90
          while time.monotonic()<deadline:
              try:
                  if urllib.request.urlopen("http://127.0.0.1:5000/login",timeout=3).status==200:
                      print("Flask HTTP 200; demo ready")
                      break
              except Exception:
                  time.sleep(2)
          else:
              raise RuntimeError("Flask demo did not become ready")
          PY
          docker compose -f ops/lz11/compose.yaml exec -T app python -m flask --app app:create_app init-db
          printf '%s\n%s\n' "$KSM_UAT_PASSWORD" "$KSM_UAT_PASSWORD" | docker compose -f ops/lz11/compose.yaml exec -T app python -m flask --app app:create_app create-user employee
          docker compose -f ops/lz11/compose.yaml exec -T app python - <<'PY'
          import sqlite3
          with sqlite3.connect("/app/instance/kaspi-store-manager.sqlite3") as db:
              db.executemany(
                  "INSERT INTO products(name,sku,category,price_cents,stock) VALUES(?,?,?,?,?)",
                  [(f"Demo product {i}",f"CI-NFR-{i:04d}","Synthetic",150000+i,20)
                   for i in range(100)],
              )
              print("Synthetic catalog fixtures:",db.execute("SELECT COUNT(*) FROM products").fetchone()[0])
          PY

      - name: 30-day SQLite backup rotation and actual restore validation
        if: steps.boot.outcome == 'success'
        run: |
          docker compose -f ops/lz11/compose.yaml exec -T app python /app/ops/lz11/backup_rotate.py | tee reports/lz11/backup-restore.json

      - name: Verify separately scheduled 15-minute backup worker and persistent backup volume
        if: steps.boot.outcome == 'success'
        run: |
          docker compose -f ops/lz11/compose.yaml --profile scheduled-backups up -d --build backup-worker
          python3 - <<'PY'
          import json,subprocess,time
          cmd=["docker","compose","-f","ops/lz11/compose.yaml","exec","-T","backup-worker",
               "python","-c",
               "from pathlib import Path; print(len(list(Path('/app/backups').glob('ksm-daily-*.sqlite3'))))"]
          deadline=time.monotonic()+45
          while time.monotonic()<deadline:
              proc=subprocess.run(cmd,capture_output=True,text=True)
              if proc.returncode==0 and proc.stdout.strip().isdigit() and int(proc.stdout.strip())>=1:
                  proof={"status":"PASS","type":"separate named-volume scheduled-backup worker",
                         "interval_seconds":900,"retention_days":30,
                         "initial_backups":int(proc.stdout.strip())}
                  with open("reports/lz11/backup-worker.json","w",encoding="utf-8") as out:
                      json.dump(proof,out,indent=2)
                  print(json.dumps(proof))
                  break
              time.sleep(2)
          else:
              raise RuntimeError("Scheduled backup worker did not create an initial backup")
          PY

      - name: 200 virtual users for 30 seconds (NFR-01)
        id: nfr200
        if: steps.boot.outcome == 'success'
        continue-on-error: true
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --network host \
            -e KSM_BASE_URL=http://127.0.0.1:5000 \
            -e KSM_USER=employee -e KSM_PASSWORD="$KSM_UAT_PASSWORD" \
            -e KSM_VUS=200 -e KSM_DURATION=30s \
            -v "$PWD:/work" -w /work \
            grafana/k6:latest run \
            --summary-export=/work/reports/lz11/k6-200-summary.json \
            /work/tests/lz11/load/read_catalog.js

      - name: Exercise app stop/start runbook, preserving SQLite fixture data
        if: steps.boot.outcome == 'success'
        run: |
          python3 - <<'PY'
          import json,subprocess,time,urllib.request
          compose=["docker","compose","-f","ops/lz11/compose.yaml"]
          subprocess.run(compose+["stop","app"],check=True)
          time.sleep(2)
          try:
              urllib.request.urlopen("http://127.0.0.1:5000/login",timeout=2)
          except Exception:
              print("Expected downtime detected after compose stop")
          else:
              raise RuntimeError("Expected downtime not detected")
          start=time.monotonic()
          subprocess.run(compose+["start","app"],check=True)
          for i in range(60):
              try:
                  if urllib.request.urlopen("http://127.0.0.1:5000/login",timeout=2).status==200:
                      break
              except Exception:
                  time.sleep(1)
          else:
              raise RuntimeError("App did not recover")
          recovery=round(time.monotonic()-start,3)
          verified=subprocess.run(compose+["exec","-T","app","python","-c",
              "import sqlite3; c=sqlite3.connect('/app/instance/kaspi-store-manager.sqlite3'); assert c.execute('select count(*) from products').fetchone()[0]==100; assert c.execute('pragma integrity_check').fetchone()[0]=='ok'; print('SQLite fixtures intact')"],
              check=True,capture_output=True,text=True)
          print(verified.stdout)
          record={"type":"synthetic runbook stop/start","status":"PASS",
                  "observed_app_down":True,"recovered_http_200":True,
                  "sqlite_fixture_products":100,"recovery_seconds":recovery}
          open("reports/lz11/rollback-drill.json","w",encoding="utf-8").write(json.dumps(record,indent=2))
          print(json.dumps(record))
          PY

      - name: Exercise real old-release rollback after injected HTTP 503
        if: steps.boot.outcome == 'success'
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          python3 -m pip install -r requirements.lock
          python3 tools/rollback_drill.py \
            --work-dir "$RUNNER_TEMP/lz11-release-rollback" \
            --report "$PWD/reports/lz11/release-rollback.json"

      - name: Upload factual evidence even if NFR-01 fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lz11-nfr-and-recovery-evidence
          path: reports/lz11/
          retention-days: 14
          if-no-files-found: warn

      - name: Fail if 200-user NFR thresholds were missed
        if: steps.nfr200.outcome == 'failure'
        run: |
          echo "200-VU NFR-01 not met: inspect k6-200-summary.json; do not claim PASS"
          exit 1

      - name: Stop isolated CI app
        if: always()
        run: docker compose -f ops/lz11/compose.yaml down || true
