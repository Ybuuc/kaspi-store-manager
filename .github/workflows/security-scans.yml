name: Security scans

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve Python dependencies for vulnerability scan
        run: |
          python3 -m venv .scan-venv
          .scan-venv/bin/python -m pip install -r requirements.txt
          mkdir -p scan
          .scan-venv/bin/python -m pip freeze > scan/requirements.txt
      - name: Run Trivy filesystem scan
        run: |
          docker run --rm -v "$PWD:/work" aquasec/trivy:latest fs \
            --scanners vuln,misconfig,secret \
            --skip-dirs /work/.scan-venv \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            /work

  gitleaks:
    name: Gitleaks repository scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
