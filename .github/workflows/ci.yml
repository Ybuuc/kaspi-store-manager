name: CI
on:
  push:
    branches: [main, lz10-ci-dora]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.17.3
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock pytest==8.4.2
      - name: Release gate — all 37 tests including UAT technical preflight
        run: python -m pytest -q tests/test_app.py tests/lz11/test_contract.py tests/lz11/test_uat_preflight.py

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scan locked production dependencies
        run: |
          mkdir -p scan
          cp requirements.lock scan/requirements.txt
          docker run --rm -v "$PWD/scan:/scan" aquasec/trivy:0.69.3 fs \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            --format json --output /scan/trivy.json /scan
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-scan
          path: scan/trivy.json
          if-no-files-found: error

  build:
    needs: [lint, test, dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_release.py
      - name: Verify clean release bundle
        run: |
          python -m zipfile -e dist/*.zip /tmp/ksm-release
          python -m pip install -r /tmp/ksm-release/requirements.lock
          cd /tmp/ksm-release
          python - <<'PY'
          import sqlite3
          from app import create_app, hash_password
          app = create_app({'TESTING': True, 'SECRET_KEY': 'build-smoke-only'})
          result = app.test_cli_runner().invoke(args=['init-db'])
          assert result.exit_code == 0, result.output
          client = app.test_client()
          assert client.get('/login').status_code == 200
          assert client.get('/products').status_code == 302
          with sqlite3.connect(app.config['DATABASE']) as db:
              db.execute('INSERT INTO users (username, password_hash, role) VALUES (?, ?, ?)',
                         ('release-employee', hash_password('synthetic-release-password'), 'employee'))
          assert client.post('/login', data={
              'username': 'release-employee',
              'password': 'synthetic-release-password',
          }).status_code == 302
          assert client.get('/products').status_code == 200
          assert client.get('/orders').status_code == 200
          assert client.get('/admin').status_code == 403
          assert client.get('/reports/sales').status_code == 403
          print('Release smoke: login, catalog, orders and RBAC PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kaspi-store-manager-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
